version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ASR_WS_URL=ws://asr-engine:3001/ws
      - TRANSLATOR_WS_URL=ws://translator:3002/ws
    networks:
      - interp-net
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 10s
      retries: 3

  asr-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr-engine
    ports:
      - '${ASR_PORT:-3001}:3001'
    environment:
      - PORT=3001
      - MOCK_MODE=${MOCK_MODE:-true}
      - MOCK_LATENCY_MS=${MOCK_LATENCY_MS:-100}
    networks:
      - interp-net

  translator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.translator
    ports:
      - '${TRANSLATOR_PORT:-3002}:3002'
    environment:
      - PORT=3002
      - MOCK_MODE=${MOCK_MODE:-true}
      - MOCK_LATENCY_MS=${MOCK_LATENCY_MS:-50}
    networks:
      - interp-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - '${WEB_PORT:-80}:80'
    environment:
      - WEB_PORT=80
      - GATEWAY_PORT=3000
    depends_on:
      - gateway
    networks:
      - interp-net

networks:
  interp-net:
    driver: bridge
